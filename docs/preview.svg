<text xml:space="preserve" x="80" y="584" font-size="18" fill="#60716E" font-weight="400">virtio-gpu carries guest commands. The embedding application supplies the host context.</text>
<text xml:space="preserve" x="580.0" y="696" font-size="15" fill="#60716E" font-weight="400" text-anchor="middle">Illustrative embedding preview · Library, not a standalone diagnostics app</text>
